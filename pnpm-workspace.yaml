packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.0.5'
  - vite@8.2.0
  - '@ai-sdk/deepseek@3.0.17'
  - '@ai-sdk/gateway@4.0.33 || 4.0.37'
  - '@ai-sdk/provider-utils@5.0.16'
  - ai@7.0.44 || 7.0.48
